server:
  port: ${PORT:8080}
spring:
  application:
    name: TT-user_service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tt_users}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
springdoc:
  swagger-ui:
    path: swagger-ui
  open-api:
    info:
      title: TT-User
      description: Микросервис для работы с пользователями системы Task Tracker
      version: 1.0.0
task-service:
  baseUrl: http://localhost:8081/api/v1